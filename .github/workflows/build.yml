name: Compilar APK NEXUS POS

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configurar o Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Instalar o Flet CLI e dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          if [ -f requisitos.txt ]; then pip install -r requisitos.txt; fi

      - name: Gerar o ficheiro APK
        run: |
          flet build apk

      - name: Guardar o APK gerado para Download
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-POS-APK
          path: build/apk/*.apk

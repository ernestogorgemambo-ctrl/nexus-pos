name: Compilar APK NEXUS POS

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aceitar licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Flet e pacotes do requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar APK com Flet
        run: |
          flet build apk --verbose

      - name: Guardar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-POS-APK
          path: build/apk/*.apk